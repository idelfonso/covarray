name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

# Every Linux job runs inside the dev image published by dev-image.yml.
# To move to a new image: change the tag in all four jobs below in one PR,
# so CI on that PR proves the new image works before it reaches main.

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  build-test:
    name: build-test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/idelfonso/covarray-dev:sha-REPLACE_ME
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-16
            cc: gcc
            cxx: g++
            cxxflags: ""
          - compiler: clang-23
            cc: clang
            cxx: clang++
            # Make Clang use GCC 16's libstdc++ from /usr/local, not Debian's older one
            cxxflags: "--gcc-toolchain=/usr/local"
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.compiler }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ matrix.compiler }}-

      - name: Configure, build and test (dev preset)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CXXFLAGS: ${{ matrix.cxxflags }}
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          cmake --workflow --preset dev

  asan-ubsan:
    name: asan-ubsan
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/idelfonso/covarray-dev:sha-REPLACE_ME
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-asan-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-asan-

      - name: Configure, build and test (asan-ubsan preset)
        env:
          CC: clang
          CXX: clang++
          CXXFLAGS: --gcc-toolchain=/usr/local
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          cmake --workflow --preset asan-ubsan

  format:
    name: format
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/idelfonso/covarray-dev:sha-REPLACE_ME
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v5

      - name: clang-format --dry-run --Werror
        run: |
          find include src tests apps -type f \( -name '*.hpp' -o -name '*.cpp' -o -name '*.h' -o -name '*.cc' \) \
            -print0 2>/dev/null | xargs -0 --no-run-if-empty clang-format --dry-run --Werror

  clang-tidy:
    name: clang-tidy (changed files)
    runs-on: ubuntu-24.04
    continue-on-error: true
    container:
      image: ghcr.io/idelfonso/covarray-dev:sha-REPLACE_ME
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-clang-23-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-clang-23-

      - name: Configure (dev preset, compile_commands.json only)
        env:
          CC: clang
          CXX: clang++
          CXXFLAGS: --gcc-toolchain=/usr/local
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          cmake --preset dev

      - name: Run clang-tidy on changed files
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base=$(git rev-parse HEAD~1)
          fi
          git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.cpp' '*.hpp' '*.h' '*.cc' \
            > changed_files.txt || true
          if [ -s changed_files.txt ]; then
            xargs -a changed_files.txt clang-tidy -p build/dev
          else
            echo "No changed C++ files."
          fi
